name: Build

# PyInstaller no hace cross compile: el .app sale de macOS y el .exe de Windows.
# Se dispara con un tag v* (empaqueta y publica el release) o a mano desde la
# pestaña Actions con "Run workflow" (empaqueta y valida, sin publicar).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            artifact: ToMarkdown-macos
          - os: windows-latest
            label: Windows
            artifact: ToMarkdown-windows

    steps:
      - uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # web/dist/output.css y las fuentes van versionados, así que el build no
      # necesita Node en ningún momento.
      - name: Instalar dependencias
        run: uv sync --extra dev

      # En un tag, el nombre (sin la v) tiene que coincidir con app.config.__version__,
      # que es lo que empaqueta hatchling y muestra la app. Si no, el binario
      # saldría con una versión equivocada.
      - name: Validar que el tag coincide con __version__
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(uv run python -c 'import app.config; print(app.config.__version__)')"
          if [ "$tag" != "$code" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con __version__ ($code). Actualizá app/config.py o recreá el tag."
            exit 1
          fi
          echo "✅ Tag $GITHUB_REF_NAME == __version__ $code"

      - name: Pruebas
        run: uv run pytest

      - name: Empaquetar
        run: uv run pyinstaller --noconfirm --log-level WARN build.spec

      # Comprueba que el bundle está completo: --self-check importa los módulos
      # de los converters (los hiddenimports de build.spec) y convierte una
      # muestra de cada formato pesado. Si falta una dependencia en el bundle,
      # este paso queda en rojo aunque en desarrollo funcione. En Windows el
      # ejecutable es de tipo ventana y no escribe en consola: solo cuenta el
      # código de salida.
      - name: Generar muestras de todos los formatos
        shell: bash
        run: uv run python scripts/gen_selfcheck_samples.py "${{ runner.temp }}/samples"

      - name: Verificar el empaquetado (macOS)
        if: runner.os == 'macOS'
        run: ./dist/ToMarkdown.app/Contents/MacOS/ToMarkdown --self-check "${{ runner.temp }}/samples"

      - name: Verificar el empaquetado (Windows)
        if: runner.os == 'Windows'
        run: ./dist/ToMarkdown.exe --self-check "${{ runner.temp }}/samples"

      - name: Leer la versión
        id: version
        shell: bash
        run: echo "value=$(uv run python -c 'import app.config; print(app.config.__version__)')" >> "$GITHUB_OUTPUT"

      # macOS: un .dmg con alias a /Applications es lo que se espera para
      # instalar; el .app suelto dentro de un zip se descarta. Se arma con
      # hdiutil y no con create-dmg: este último posiciona los iconos con
      # AppleScript sobre Finder, que en un runner headless se cuelga.
      - name: Empaquetar .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg="ToMarkdown-${{ steps.version.outputs.value }}.dmg"
          staging="$(mktemp -d)"
          cp -R dist/ToMarkdown.app "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "ToMarkdown" -srcfolder "$staging" -ov -format UDZO "$dmg"

      # Windows: el .exe onefile como portable (en zip) y, aparte, un instalador
      # de Inno Setup (Program Files, menú inicio, desinstalador).
      - name: Comprimir portable (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/ToMarkdown.exe -DestinationPath ToMarkdown-${{ steps.version.outputs.value }}-portable.zip

      - name: Instalador (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.value }}" `
            packaging\windows\installer.iss
          # A la raíz del workspace: así el artefacto no anida un dir dist/ y
          # todos los assets del release quedan planos.
          Move-Item dist\ToMarkdown-Setup-*.exe .

      - name: Publicar artefacto (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ToMarkdown-*.dmg
          if-no-files-found: error

      - name: Publicar artefacto (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ToMarkdown-*-portable.zip
            ToMarkdown-Setup-*.exe
          if-no-files-found: error

  release:
    name: Publicar release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      # Las notas salen del CHANGELOG que se mantiene a mano, no del
      # autogenerador de GitHub (que lista PRs y arma un "New Contributors"
      # sin sentido para un proyecto de una persona).
      - name: Notas del release desde el CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > release-notes.md

          prev="$(git tag --list 'v*' --sort=-version:refname | grep -vFx "$GITHUB_REF_NAME" | head -1)"
          if [ -n "$prev" ]; then
            printf '\n**Changelog completo:** https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> release-notes.md
          fi

          echo "--- notas ---"; cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          body_path: release-notes.md
