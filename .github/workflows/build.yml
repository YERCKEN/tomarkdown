name: Build

# PyInstaller no hace cross compile: el .app sale de macOS y el .exe de Windows.
# Se dispara al mergear a `main` (empaqueta y, si `__version__` no tiene tag
# todavía, publica el release) o a mano desde Actions con "Run workflow"
# (empaqueta y valida, sin publicar).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Rápido: lee __version__ y decide si hay que publicar. Un merge a main sin
  # subir la versión no publica nada (el tag ya existe).
  check:
    name: Chequeo de versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decidir versión y si se publica
        id: decide
        shell: bash
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' app/config.py)"
          if [ -z "$version" ]; then
            echo "::error::No se pudo leer __version__ de app/config.py"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" != "push" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Ejecución manual: se empaqueta pero no se publica."
          elif git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version ya está publicado, no se genera release."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Se va a publicar v$version."
          fi

  build:
    name: ${{ matrix.label }}
    needs: check
    if: needs.check.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            artifact: ToMarkdown-macos
          - os: windows-latest
            label: Windows
            artifact: ToMarkdown-windows

    steps:
      - uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # web/dist/output.css y las fuentes van versionados, así que el build no
      # necesita Node en ningún momento.
      - name: Instalar dependencias
        run: uv sync --extra dev

      - name: Pruebas
        run: uv run pytest

      - name: Empaquetar
        run: uv run pyinstaller --noconfirm --log-level WARN build.spec

      # Comprueba que el bundle está completo: --self-check importa los módulos
      # de los converters (los hiddenimports de build.spec) y convierte una
      # muestra de cada formato pesado. Si falta una dependencia en el bundle,
      # este paso queda en rojo aunque en desarrollo funcione. En Windows el
      # ejecutable es de tipo ventana y no escribe en consola: solo cuenta el
      # código de salida.
      - name: Generar muestras de todos los formatos
        shell: bash
        run: uv run python scripts/gen_selfcheck_samples.py "${{ runner.temp }}/samples"

      - name: Verificar el empaquetado (macOS)
        if: runner.os == 'macOS'
        run: ./dist/ToMarkdown.app/Contents/MacOS/ToMarkdown --self-check "${{ runner.temp }}/samples"

      - name: Verificar el empaquetado (Windows)
        if: runner.os == 'Windows'
        run: ./dist/ToMarkdown.exe --self-check "${{ runner.temp }}/samples"

      # macOS: un .dmg con alias a /Applications es lo que se espera para
      # instalar; el .app suelto dentro de un zip se descarta. Se arma con
      # hdiutil y no con create-dmg: este último posiciona los iconos con
      # AppleScript sobre Finder, que en un runner headless se cuelga.
      - name: Empaquetar .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg="ToMarkdown-${{ needs.check.outputs.version }}.dmg"
          staging="$(mktemp -d)"
          cp -R dist/ToMarkdown.app "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "ToMarkdown" -srcfolder "$staging" -ov -format UDZO "$dmg"

      # Windows: el .exe onefile como portable (en zip) y, aparte, un instalador
      # de Inno Setup (Program Files, menú inicio, desinstalador).
      - name: Comprimir portable (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/ToMarkdown.exe -DestinationPath ToMarkdown-${{ needs.check.outputs.version }}-portable.zip

      - name: Instalador (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ needs.check.outputs.version }}" `
            packaging\windows\installer.iss
          # A la raíz del workspace: así el artefacto no anida un dir dist/ y
          # todos los assets del release quedan planos.
          Move-Item dist\ToMarkdown-Setup-*.exe .

      - name: Publicar artefacto (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ToMarkdown-*.dmg
          if-no-files-found: error

      - name: Publicar artefacto (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ToMarkdown-*-portable.zip
            ToMarkdown-Setup-*.exe
          if-no-files-found: error

  release:
    name: Publicar release
    needs: [check, build]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      # Las notas salen del CHANGELOG que se mantiene a mano, no del
      # autogenerador de GitHub (que lista PRs y arma un "New Contributors"
      # sin sentido para un proyecto de una persona).
      - name: Notas del release desde el CHANGELOG
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > release-notes.md

          # El tag v$VERSION todavía no existe (lo crea action-gh-release), así
          # que el último tag es el release anterior.
          prev="$(git tag --list 'v*' --sort=-version:refname | head -1)"
          if [ -n "$prev" ]; then
            printf '\n**Changelog completo:** https://github.com/%s/compare/%s...v%s\n' \
              "$GITHUB_REPOSITORY" "$prev" "$VERSION" >> release-notes.md
          fi

          echo "--- notas ---"; cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          fail_on_unmatched_files: true
          body_path: release-notes.md
