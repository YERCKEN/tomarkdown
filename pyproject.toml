[project]
name = "tomarkdown"
description = "Convierte documentos a Markdown desde una app de escritorio nativa"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "pywebview>=6.2.1",
    "markitdown[pdf,docx,pptx,xlsx,xls,outlook]>=0.1.7",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.16",
    "pytest>=8",
    "ruff>=0.6",
    # Solo para generar la muestra .xls de --self-check (scripts/gen_selfcheck_samples.py).
    # markitdown lee .xls con xlrd; xlwt es lo unico que lo escribe.
    "xlwt>=1.3",
]

[project.scripts]
tomarkdown = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes (bugs reales). I: orden de imports.
# UP: moderniza sintaxis a py3.12. B: bugbear (patrones que casi siempre son bugs).
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "app/config.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]
